name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: gofmt -l .
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o loom ./cmd/loom
      - run: ./loom check examples/fibonacci.loom
      - run: ./loom run examples/fibonacci.loom --allow-execution
